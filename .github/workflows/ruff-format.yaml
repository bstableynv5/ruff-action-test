name: Ruff Format

on:
  push:
    branches:
      - main # Or your default branch
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to push commits back to the repo

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Run Ruff Organize Imports
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: "check --select I --fix"

      - name: Run Ruff Format and Fix
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: format

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "style: auto-format code with Ruff [skip ci]"
          # commit_user_name: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          # commit_user_email: "github-actions[bot]@users.noreply.github.com"
